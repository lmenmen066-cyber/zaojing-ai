name: 验收 · L2/L4 Acceptance

# 真跑真判：一次构建 → L2/L4 两路验收各取所需。
# build job 跑 build-installer.py 生成 dist/、portable/、installer/build-evidence.json、
# build/ZaojingAI/EXE-00.toc 等中间件，以 actions/upload-artifact 交予下游两 job 下载复用。
# 这样 L2 的 P49（setup.iss Source 存在性）与 P53（payload 字节求和对齐 build-evidence）
# 拿到真值产物、L4 的 P50（tkinter/desktop_hub 是否在 TOC 里）拿到真 TOC，
# 判据一律不削弱。两个 harness 都以 sys.exit(1 if fails else 0) 收尾，任一 FAIL 即令该
# job 变红——不伪造绿。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新运行会取消尚未跑完的旧运行，省 Windows runner 额度
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────
  # 构建：真实跑一次 build-installer.py，把 dist/build/installer/portable 打成一份 artifact
  # 交给 L2 和 L4 各自下载。构建自身的告警/优雅跳过的退出码不掩盖下游真实判定；
  # 若产物缺席，下游会在对应 check 上如实 FAIL，CI 仍红——判据只认磁盘实物。
  # ───────────────────────────────────────────────────────────
  build:
    name: 构建 · PyInstaller 冻结 EXE + 便携包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python 3.12（项目验证区间 >=3.11,<3.13）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（含 PyInstaller、opencv、fontTools、Pillow）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 安装 Inno Setup 编译器（供安装版构建证据为真；缺失时构建脚本会优雅跳过）
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: 补齐 Inno Setup 简体中文语言包（choco 发行版仅含官方内嵌语言）
        # setup.iss [Languages] 声明 compiler:Languages\ChineseSimplified.isl——非本机自造路径，
        # 是 Inno 官方社区译本的固定文件名。choco 的 innosetup 6.7.1 只内嵌 Default/Armenian/
        # BrazilianPortuguese/Catalan/Corsican/German/Japanese 七枚 .isl，中文 .isl 属社区译本，
        # 官方安装程序会附带、choco 打包不带。此处从 jrsoftware/issrc（Inno 官方源码仓库）拉取，
        # 装到 ISCC 同级 Languages 目录，让 CI 环境与产品 setup.iss 声称的编译面一致。
        # 拉不到即判红——不做静默跳过，避免"编译器在但语言缺失→iscc exit 2"的假绿。
        shell: bash
        run: |
          set -euo pipefail
          ISL_DIR="/c/Program Files (x86)/Inno Setup 6/Languages"
          if [ ! -d "$ISL_DIR" ]; then
            echo "[ERROR] Inno Setup Languages 目录缺席：choco 未装成？$ISL_DIR"
            exit 1
          fi
          curl -fsSL -o "$ISL_DIR/ChineseSimplified.isl" \
            https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl
          test -s "$ISL_DIR/ChineseSimplified.isl"
          echo "[OK] ChineseSimplified.isl 就位：$(wc -c < "$ISL_DIR/ChineseSimplified.isl") 字节"

      - name: 构建冻结件（build-installer.py → dist/ZaojingAI.exe + build/ZaojingAI/*.toc + installer/build-evidence.json + 便携 ZIP + portable/）
        shell: bash
        continue-on-error: true
        run: |
          python build-installer.py | tee build-installer.log
          exit "${PIPESTATUS[0]}"

      - name: 上传构建产物（dist + build + installer + portable + ZIP + setup.iss）
        # if: always()：即便 build 步有告警退出也上传——下游对每个 check 判据自带缺件红
        #
        # 为什么 setup.iss 必须随附（P53 日期边界修复，判据只加强不削弱）：
        # build-installer.py 每次构建都重生成 setup.iss，其 [Registry] 段把 InstallDate
        # 打成 datetime.now()——即"构建当日"。build-evidence.json 记录的是**这份已编译脚本**
        # 的 bytes/sha256。若只传证据不传脚本，L2/L4 下载后磁盘上仍是 checkout 出来的**上次
        # 提交日**那份 setup.iss，其 sha 与证据所记必然不符 ⇒ installer_manifest 引擎如实判
        # artifact_not_from_current_script（"产物并非由当前脚本产出"），一旦构建日≠setup.iss
        # 最后提交日就假红。setup.iss 本就是"被编译的源码实物"，与 build-evidence.json 属同一
        # 份证据链，缺席才是这套 build-artifact 架构的漏项。随附后 download-artifact 把它还原
        # 到证据所记的同一绝对路径，测试用 hashlib 独立复算 _iss49 的 sha 与证据期望恒等——
        # 校验面因此对"构建日/提交日"免疫，且判据语义只更严密（核的就是编译时那份字节）。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-artifacts
          path: |
            dist/
            build/
            installer/
            portable/
            setup.iss
            zaojing-ai-1.0.8-portable.zip
            zaojing-ai-1.0.8-portable.zip.sha256
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-installer.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────
  # L2：源码级功能验收（自起真实 uvicorn 服务打真 HTTP；同时依赖 build/ 与 dist/ 的实物证据）
  # ───────────────────────────────────────────────────────────
  l2-functional:
    name: L2 · 源码级功能验收
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 下载构建产物（dist/ + build/ + installer/ + portable/ + ZIP）
        uses: actions/download-artifact@v4
        with:
          name: built-artifacts
          path: .

      - name: 运行 L2（test-full-functional.py）
        shell: bash
        run: |
          python test-full-functional.py | tee l2-acceptance.log
          exit "${PIPESTATUS[0]}"

      - name: 上传 L2 验收日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-acceptance-log
          path: l2-acceptance.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────
  # L4：冻结 EXE 活体验收（对 portable/ 与 build/ZaojingAI/EXE-00.toc 逐 check 判定）
  # ───────────────────────────────────────────────────────────
  l4-packaged:
    name: L4 · 冻结 EXE 验收
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 下载构建产物（dist/ + build/ + installer/ + portable/ + ZIP）
        uses: actions/download-artifact@v4
        with:
          name: built-artifacts
          path: .

      - name: 运行 L4（test-packaged-exe.py）
        shell: bash
        run: |
          python test-packaged-exe.py | tee l4-acceptance.log
          exit "${PIPESTATUS[0]}"

      - name: 上传 L4 验收日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-acceptance-log
          path: l4-acceptance.log
          if-no-files-found: warn

      - name: 上传冻结产物（便携 ZIP，供人肉下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: |
            zaojing-ai-1.0.8-portable.zip
            zaojing-ai-1.0.8-portable.zip.sha256
          if-no-files-found: warn
